{{define "content"}}
<main class="bg-bg">
    <section class="min-h-screen flex items-center justify-center px-6 py-24">
        <div class="w-full max-w-md text-center space-y-4">
            <h1 class="font-display uppercase tracking-tight text-black dark:text-white text-3xl">Welcome,</h1>
            <p class="font-body text-accent text-xl">{{.Username}}</p>
            <p class="font-body text-muted leading-relaxed">You're signed in.</p>
            <a href="/" class="btn btn--accent inline-block text-white hover:translate-x-1">Back home →</a>
        </div>
    </section>
</main>
{{end}}
