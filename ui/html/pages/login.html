{{define "content"}}
<main class="bg-bg">
    <section class="min-h-screen flex items-center justify-center px-6 py-24">
        <div class="w-full max-w-2xl mx-auto bg-surface border-2 border-edge rounded-lg p-8 md:p-10 shadow-[8px_8px_0_0_var(--color-edge)]">
            <div class="grid grid-cols-1 md:grid-cols-[1.1fr_1.3fr] gap-8 md:gap-12 items-start">
                <div class="flex flex-col justify-center space-y-4 max-w-xs">
                    <h1 class="font-display uppercase tracking-tight text-black dark:text-white text-4xl mb-2">Sign in</h1>
                    <p class="leading-relaxed font-body text-muted">Welcome back — enter your details to continue.</p>
                </div>
                <form method="post" action="/user/login" novalidate class="space-y-4 w-full">
                    {{template "csrf.html" .}}
                    <div>
                        <label for="email" class="block mb-1 font-body uppercase tracking-wide text-sm text-text">Email</label>
                        <input type="email" id="email" name="email" autocomplete="username" required
                            class="w-full px-3 py-2 rounded-md border-2 border-edge bg-surface text-text font-body focus:border-accent outline-none" />
                    </div>
                    <div>
                        <label for="password" class="block mb-1 font-body uppercase tracking-wide text-sm text-text">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required
                            class="w-full px-3 py-2 rounded-md border-2 border-edge bg-surface text-text font-body focus:border-accent outline-none" />
                    </div>
                    <button type="submit" class="btn btn--accent w-full text-white hover:translate-x-1">Sign in →</button>
                </form>
            </div>
        </div>
    </section>
</main>
{{end}}
