{{define "content"}}
<main class="bg-bg">
    <section class="min-h-screen flex items-center justify-center px-6 py-24">
        <div class="w-full max-w-md">
            <h1 class="font-display uppercase tracking-tight text-black dark:text-white text-3xl mb-2">Create account</h1>
            <p class="mb-8 font-body text-muted leading-relaxed">Make an account to get started.</p>

            {{template "csrf.html" .}}
            <form method="post" action="/user/signup" novalidate class="space-y-4">
                <div>
                    <label for="username" class="block mb-1 font-body uppercase tracking-wide text-sm text-text">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required
                        class="w-full px-3 py-2 rounded-md border-2 border-edge bg-surface text-text font-body focus:border-accent outline-none" />
                </div>
                <div>
                    <label for="email" class="block mb-1 font-body uppercase tracking-wide text-sm text-text">Email</label>
                    <input type="email" id="email" name="email" autocomplete="username" required
                        class="w-full px-3 py-2 rounded-md border-2 border-edge bg-surface text-text font-body focus:border-accent outline-none" />
                </div>
                <div>
                    <label for="password" class="block mb-1 font-body uppercase tracking-wide text-sm text-text">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required
                        class="w-full px-3 py-2 rounded-md border-2 border-edge bg-surface text-text font-body focus:border-accent outline-none" />
                </div>
                <div>
                    <label for="confirm" class="block mb-1 font-body uppercase tracking-wide text-sm text-text">Confirm password</label>
                    <input type="password" id="confirm" name="confirm" autocomplete="new-password" required
                        class="w-full px-3 py-2 rounded-md border-2 border-edge bg-surface text-text font-body focus:border-accent outline-none" />
                </div>
                <button type="submit" class="btn btn--accent w-full text-white hover:translate-x-1">Create account →</button>
            </form>
        </div>
    </section>
</main>
{{end}}
