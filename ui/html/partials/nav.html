<script>
    (function () {
        const links = document.querySelectorAll('.rail-link, .mobile-link');

        function setActive(name) {
            links.forEach(function (link) {
                link.classList.toggle('is-active', link.getAttribute('href') === name);
            });
        }

        var path = location.pathname;
        if (path === '/') setActive('/');
        else if (path.startsWith('/projects')) setActive('/projects');
        else setActive('/');

        const mid = window.innerHeight / 2;
        function activeSection() {
            let best = null;
            links.forEach(function (link) {
                const href = link.getAttribute('href');
                const el = document.getElementById(href.replace(/[^a-zA-Z]/g, ''));
                if (!el) return;
                const box = el.getBoundingClientRect();
                if (mid >= box.top && mid <= box.bottom) best = link.getAttribute('href');
            });
            return best;
        }

        if (path === '/') {
            window.addEventListener('scroll', function () {
                setActive(activeSection() || '/');
            }, {passive: true});
        }
    })();

    // Sliding-sheets scroll effect. Each full-screen section already pins in place via
    // `position: sticky; top: 0` (CSS), so the next one naturally rises from below as you
    // scroll past it. This adds layered depth: a subtle translateY driven per frame makes
    // sheets slide at slightly different rates — nearer ones rise faster, farther ones sink —
    // instead of swapping rigidly. No-op on pages without .parallax-section elements.
    (function () {
        var sections = Array.prototype.slice.call(document.querySelectorAll('.parallax-section'));
        if (!sections.length) return;

        var factor = 0.35;          // drift strength relative to the viewport center
        var maxDrift = window.innerHeight * 0.18; // clamp so sheets never overshoot/clip

        function render() {
            var mid = window.innerHeight / 2;
            for (var i = 0; i < sections.length; i++) {
                var top = sections[i].getBoundingClientRect().top;
                var drift = (mid - top) * factor; // below center -> negative -> rises up
                if (drift > maxDrift) drift = maxDrift;
                if (drift < -maxDrift) drift = -maxDrift;
                sections[i].style.transform = 'translateY(' + drift + 'px)';
            }
        }

        // Drive updates off requestAnimationFrame so transforms batch to the display's
        // refresh rate instead of firing on every raw scroll event — that keeps the sheets
        // gliding smoothly rather than stuttering. Only re-render when something actually moved.
        var ticking = false;
        function onScroll() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {render(); ticking = false;});
        }

        window.addEventListener('scroll', onScroll, {passive: true});
        window.addEventListener('resize', function () {render();});
        render();
    })();
</script>

<script>
(function () {
    var nav = document.querySelector('.mobile-nav');
    var toggle = document.getElementById('nav-toggle');
    var menu = document.getElementById('mobile-menu');
    if (!nav || !toggle || !menu) return;

    function openMenu() {
        nav.classList.add('is-open');   // pin to top + dim content behind (overlay)
        toggle.classList.add('is-open'); // bars -> X
        toggle.setAttribute('aria-expanded', 'true');
        menu.classList.add('is-open');   // animate the sheet down
        document.body.style.overflow = 'hidden';  // lock scroll while the overlay is up
    }
    function closeMenu() {
        nav.classList.remove('is-open');
        toggle.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        menu.classList.remove('is-open');
        document.body.style.overflow = '';          // restore scroll on close
    }

    toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        if (menu.classList.contains('is-open')) closeMenu(); else openMenu();
    });

    // Tap a link -> collapse the menu, then let the anchor scroll normally.
    menu.querySelectorAll('.mobile-link').forEach(function (link) {
        link.addEventListener('click', function () { closeMenu(); });
    });

    // Escape closes; clicking outside the toggle/menu also closes.
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && menu.classList.contains('is-open')) closeMenu();
    });
    document.addEventListener('click', function (e) {
        if (menu.classList.contains('is-open') && !toggle.contains(e.target) && !menu.contains(e.target)) closeMenu();
    });
})();
</script>
