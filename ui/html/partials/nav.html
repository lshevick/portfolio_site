<nav class="rail" aria-label="Primary">
    <div>
        <a href="/" class="rail-mark hover:text-accent transition-colors">Levi Shevick</a>
    </div>

    <ul class="rail-links">
        <li><a href="/" class="rail-link is-home">Home</a></li>
        <li><a href="#about" class="rail-link is-about">About</a></li>
        <li><a href="#skills" class="rail-link is-skills">Skills</a></li>
        <li><a href="/projects" class="rail-link is-projects">Projects</a></li>
        <li><a href="#contact" class="rail-link is-contact">Contact</a></li>
    </ul>

    <div>
        <button type="button" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"
            class="rail-toggle" title="Toggle dark mode">☾</button>
    </div>
</nav>

<script>
    (function () {
        var links = Array.prototype.slice.call(document.querySelectorAll('.rail-link'));
        var toggle = document.getElementById('theme-toggle');

        // Reflect current theme on the toggle glyph.
        if (toggle) {
            if (document.documentElement.classList.contains('dark')) {
                toggle.textContent = '☀';
            } else {
                toggle.textContent = '☾';
            }
        }

        function setActive(name) {
            links.forEach(function (a) {
                a.classList.toggle('is-active', a.getAttribute('href') === name);
            });
        }

        // Full-page routes: highlight by exact pathname.
        var path = location.pathname;
        if (path === '/') setActive('Home');
        else if (path.startsWith('/projects')) setActive('Projects');
        else setActive('Home');

        // Scroll-spy for section anchors (#about, #skills, ...). Only fires when
        // the target actually exists in this document.
        var targets = Array.prototype.slice.call(document.querySelectorAll('[id]'));
        if (targets.length) {
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (e.isIntersecting) setActive('#' + e.target.id);
                });
            }, { rootMargin: '0px 0px -50% 0px', threshold: 0 });
            targets.forEach(function (t) { io.observe(t); });
        }

        window.addEventListener('scroll', function () {
            // Last-section-in-viewport wins; otherwise fall back to current path.
            var visible = null;
            links.forEach(function (a) {
                if (a.getAttribute('href').startsWith('#') && document.getElementById(a.getAttribute('href').slice(1))) {
                    var el = document.getElementById(a.getAttribute('href').slice(1));
                    if (el && el.getBoundingClientRect().top <= window.innerHeight * 0.6) visible = a.getAttribute('href');
                }
            });
            setActive(visible || location.pathname === '/' ? 'Home' : null);
        }, { passive: true });
    })();
</script>
