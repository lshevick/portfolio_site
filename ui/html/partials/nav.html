<nav class="rail" aria-label="Primary">
    <div>
        <a href="/" class="rail-mark hover:text-accent transition-colors">Levi Shevick</a>
    </div>

    <ul class="rail-links">
        <li><a href="/" class="rail-link is-home">Home</a></li>
        <li><a href="/#about" class="rail-link is-about">About</a></li>
        <li><a href="/#skills" class="rail-link is-skills">Skills</a></li>
        <li><a href="/projects" class="rail-link is-projects">Projects</a></li>
        <li><a href="/#contact" class="rail-link is-contact">Contact</a></li>
    </ul>

    <div>
        <button type="button" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" class="rail-toggle"
            title="Toggle dark mode">
            <!-- Moon: shown in light mode -->
            <svg class="rail-icon rail-icon--moon" viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <!-- Sun: shown in dark mode -->
            <svg class="rail-icon rail-icon--sun hidden" viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
        </button>
    </div>
</nav>

<script>
    (function () {
        const links = document.querySelectorAll('.rail-link');

        function setActive(name) {
            links.forEach(function (link) {
                link.classList.toggle('is-active', link.getAttribute('href') === name);
            });
        }

        var path = location.pathname;
        if (path === '/') setActive('/');
        else if (path.startsWith('/projects')) setActive('/projects');
        else setActive('/');

        const mid = window.innerHeight / 2;
        function activeSection() {
            let best = null;
            links.forEach(function (link) {
                const href = link.getAttribute('href');
                const el = document.getElementById(href.replace(/[^a-zA-Z]/g, ''));
                if (!el) return;
                const box = el.getBoundingClientRect();
                if (mid >= box.top && mid <= box.bottom) best = link.getAttribute('href');
            });
            return best;
        }

        if (path === '/') {
            window.addEventListener('scroll', function () {
                setActive(activeSection() || '/');
            }, {passive: true});
        }
    })();

    // Sliding-sheets scroll effect. Each full-screen section already pins in place via
    // `position: sticky; top: 0` (CSS), so the next one naturally rises from below as you
    // scroll past it. This adds layered depth: a subtle translateY driven per frame makes
    // sheets slide at slightly different rates — nearer ones rise faster, farther ones sink —
    // instead of swapping rigidly. No-op on pages without .parallax-section elements.
    (function () {
        var sections = Array.prototype.slice.call(document.querySelectorAll('.parallax-section'));
        if (!sections.length) return;

        var factor = 0.35;          // drift strength relative to the viewport center
        var maxDrift = window.innerHeight * 0.18; // clamp so sheets never overshoot/clip

        function render() {
            var mid = window.innerHeight / 2;
            for (var i = 0; i < sections.length; i++) {
                var top = sections[i].getBoundingClientRect().top;
                var drift = (mid - top) * factor; // below center -> negative -> rises up
                if (drift > maxDrift) drift = maxDrift;
                if (drift < -maxDrift) drift = -maxDrift;
                sections[i].style.transform = 'translateY(' + drift + 'px)';
            }
        }

        // Drive updates off requestAnimationFrame so transforms batch to the display's
        // refresh rate instead of firing on every raw scroll event — that keeps the sheets
        // gliding smoothly rather than stuttering. Only re-render when something actually moved.
        var ticking = false;
        function onScroll() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {render(); ticking = false;});
        }

        window.addEventListener('scroll', onScroll, {passive: true});
        window.addEventListener('resize', function () {render();});
        render();
    })();
</script>
