<nav class="rail" aria-label="Primary">
    <div>
        <a href="/" class="rail-mark hover:text-accent transition-colors">Levi Shevick</a>
    </div>

    <ul class="rail-links">
        <li><a href="/" class="rail-link is-home">Home</a></li>
        <li><a href="/#about" class="rail-link is-about">About</a></li>
        <li><a href="/#skills" class="rail-link is-skills">Skills</a></li>
        <li><a href="/projects" class="rail-link is-projects">Projects</a></li>
        <li><a href="/#contact" class="rail-link is-contact">Contact</a></li>
    </ul>

    <div>
        <button type="button" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"
            class="rail-toggle" title="Toggle dark mode">
            <!-- Moon: shown in light mode -->
            <svg class="rail-icon rail-icon--moon" viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <!-- Sun: shown in dark mode -->
            <svg class="rail-icon rail-icon--sun hidden" viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
        </button>
    </div>
</nav>

<script>
    (function () {
        var links = Array.prototype.slice.call(document.querySelectorAll('.rail-link'));

        function setActive(name) {
            links.forEach(function (a) {
                a.classList.toggle('is-active', a.getAttribute('href') === name);
            });
        }

        // Full-page routes: highlight by exact pathname, matching each link's real href.
        var path = location.pathname;
        if (path === '/') setActive('/');
        else if (path.startsWith('/projects')) setActive('/projects');
        else setActive('/');

        // Scroll-spy for section anchors (/#about, /#skills, ...). Highlight the
        // section whose box contains the vertical center of the viewport — unambiguous
        // when sections are full-screen tall. Anchors with no matching element in this
        // document (e.g. cross-page # links) are ignored so they can't steal the highlight.
        var mid = window.innerHeight / 2;
        function activeSection() {
            var best = null;
            links.forEach(function (a) {
                var href = a.getAttribute('href');
                var hashIdx = href.indexOf('#');
                if (hashIdx === -1) return;
                var el = document.getElementById(href.slice(hashIdx + 1));
                if (!el) return;
                var box = el.getBoundingClientRect();
                if (mid >= box.top && mid <= box.bottom) best = a.getAttribute('href');
            });
            return best;
        }

        // Scroll-spy only drives section highlights on the single long-scroll home page;
        // other routes keep their route highlight untouched.
        if (path === '/') {
            window.addEventListener('scroll', function () {
                setActive(activeSection() || '/');
            }, { passive: true });
        }
    })();
</script>
