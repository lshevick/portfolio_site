<nav class="rail" aria-label="Primary">
    <div>
        <a href="/" class="rail-mark hover:text-accent transition-colors">Levi Shevick</a>
    </div>

    <ul class="rail-links">
        <li><a href="/" class="rail-link is-home">Home</a></li>
        <li><a href="/#about" class="rail-link is-about">About</a></li>
        <li><a href="/#skills" class="rail-link is-skills">Skills</a></li>
        <li><a href="/projects" class="rail-link is-projects">Projects</a></li>
        <li><a href="/#contact" class="rail-link is-contact">Contact</a></li>
    </ul>

    <div>
        <button type="button" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" class="rail-toggle"
            title="Toggle dark mode">
            <!-- Moon: shown in light mode -->
            <svg class="rail-icon rail-icon--moon" viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <!-- Sun: shown in dark mode -->
            <svg class="rail-icon rail-icon--sun hidden" viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
        </button>
    </div>
</nav>

<!-- Mobile pull-out menu toggle. Pinned to the corner with position:fixed and kept OUTSIDE
     <nav class="rail"> so it stays reachable while the rail slides off-screen (a fixed child
     nested inside a transformed element would ride off with it). Hidden on desktop; styling in input.css. -->
<button type="button" id="mobile-toggle" class="mobile-toggle rail-toggle"
    aria-label="Open menu" aria-expanded="false">
    <!-- Bars: shown when the menu is closed -->
    <svg class="rail-icon rail-icon--bars" viewBox="0 0 24 24" width="22" height="22" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M5 7h14M5 12h14M5 17h14" />
    </svg>
    <!-- Cross: shown when the menu is open -->
    <svg class="rail-icon rail-icon--close" viewBox="0 0 24 24" width="22" height="22" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
    </svg>
</button>

<script>
    (function () {
        const links = document.querySelectorAll('.rail-link');

        function setActive(name) {
            links.forEach(function (link) {
                link.classList.toggle('is-active', link.getAttribute('href') === name);
            });
        }

        var path = location.pathname;
        if (path === '/') setActive('/');
        else if (path.startsWith('/projects')) setActive('/projects');
        else setActive('/');

        const mid = window.innerHeight / 2;
        function activeSection() {
            let best = null;
            links.forEach(function (link) {
                const href = link.getAttribute('href');
                const el = document.getElementById(href.replace(/[^a-zA-Z]/g, ''));
                if (!el) return;
                const box = el.getBoundingClientRect();
                if (mid >= box.top && mid <= box.bottom) best = link.getAttribute('href');
            });
            return best;
        }

        if (path === '/') {
            window.addEventListener('scroll', function () {
                setActive(activeSection() || '/');
            }, {passive: true});
        }
    })();

    (function () {
        const sections = document.querySelectorAll('.parallax-section');
        if (!sections.length) return;

        const factor = 0.35;          // drift strength relative to the viewport center
        const maxDrift = window.innerHeight * 0.18; // clamp so sheets never overshoot/clip

        function render() {
            const mid = window.innerHeight / 2;
            for (let i = 0; i < sections.length; i++) {
                const top = sections[i].getBoundingClientRect().top;
                let drift = (mid - top) * factor; // below center -> negative -> rises up
                if (drift > maxDrift) drift = maxDrift;
                if (drift < -maxDrift) drift = -maxDrift;
                sections[i].style.transform = 'translateY(' + drift + 'px)';
            }
        }
        let ticking = false;
        function onScroll() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {render(); ticking = false;});
        }

        window.addEventListener('scroll', onScroll, {passive: true});
        window.addEventListener('resize', function () {render();});
        render();
    })();

    (function () {
        var toggle = document.getElementById('mobile-toggle');
        var rail = document.querySelector('.rail');
        if (!toggle || !rail) return;

        function setOpen(open) {
            rail.classList.toggle('is-open', open);
            // Toggle carries its own is-open so the icon swap (icons live inside the button,
            // not inside .rail) keys off the button's state rather than the rail's.
            toggle.classList.toggle('is-open', open);
            toggle.setAttribute('aria-expanded', String(open));
            toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        }

        toggle.addEventListener('click', function () {
            setOpen(!rail.classList.contains('is-open'));
        });

        document.querySelectorAll('.rail-link').forEach(function (link) {
            link.addEventListener('click', function () { setOpen(false); });
        });

        window.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && rail.classList.contains('is-open')) setOpen(false);
        });

        // Leaving the mobile viewport: close the drawer and restore the desktop rail.
        window.addEventListener('resize', function () {
            if (!window.matchMedia('(max-width: 767px)').matches) setOpen(false);
        });
    })();
</script>
