{{define "base"}}
<!DOCTYPE html>
<html lang="en" class="site">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/output.css" />
    <title>Levi Shevick | Software Generalist</title>
    <!-- Restore persisted theme before paint to avoid a flash on reload -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body class="font-mono text-gray-900 bg-background">
    {{template "nav.html" .}}
    {{with .Flash}}
    <div
        class="flash text-white dark:text-black text-center px-1 py-2 bg-gray-700 dark:bg-gray-200 border border-gray-800 dark:border-gray-300 rounded-sm mx-auto w-1/4">
        {{.}}
    </div>
    {{end}}
    <div class="px-4 sm:px-6 lg:px-8 h-full">
        {{block "content" .}}
        {{end}}
    </div>
    <footer class="py-12 px-6 bg-gray-900 dark:bg-background border-t border-surface">
        <p class="text-muted text-center leading-relaxed">&copy; 2026 Levi Shevick. Built with Go.</p>
    </footer>

    <!-- Theme toggle logic (persisted to localStorage) -->
    <script defer>
        var THEME_KEY = 'theme';
        function applyTheme(dark) {
            document.documentElement.classList.toggle('dark', dark);
        }
        function toggleTheme() {
            var isDark = document.documentElement.classList.contains('dark');
            applyTheme(!isDark);
            try { localStorage.setItem(THEME_KEY, !isDark ? 'dark' : 'light'); } catch (e) {}
        }
    </script>
</body>

</html>
{{end}}
