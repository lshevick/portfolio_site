name: Deploy to GitHub Pages

# Publishes the static site (repo root) straight to the gh-pages branch.
# Triggered on pushes to this branch and PRs; also runnable manually.
on:
  push:
    branches:
      - sonny-gh-pages
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
